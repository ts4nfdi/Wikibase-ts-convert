name: Update MathModDB ontology
on:
  schedule:
    - cron: "12 5 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run-python-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout update branch
        run: |
          if git ls-remote --exit-code --heads origin update-mathmoddb-owl > /dev/null 2>&1; then
            git fetch origin update-mathmoddb-owl
            git switch -C update-mathmoddb-owl FETCH_HEAD
          else
            git switch -c update-mathmoddb-owl
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run mathmod_pipeline.py
        run: python main.py mathmoddb

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add ./pipelines/mathmoddb/out/MathModDB.owl
          
          if git commit -m "Update MathModDB.owl"; then
            git push origin update-mathmoddb-owl
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Committed MathModDB.owl update."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          fi

      - name: Create pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh pr list --head update-mathmoddb-owl --state open --json number --jq '.[0].number')" ]; then
            echo "Pull request already exists."
          else
            gh pr create \
              --base main \
              --head update-mathmoddb-owl \
              --title "Update MathModDB.owl" \
              --body "This pull request updates the generated MathModDB.owl ontology. It was created by the 'Update MathModDB ontology' worklfow."
            echo "Created new pull request."
          fi